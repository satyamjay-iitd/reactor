[package]
name = "ping_pong_actor"
version = "0.1.0"
rust-version = "1.86"
edition = "2024"

[lib]
name = "ping_pong_actor"
crate-type = ["cdylib", "rlib"]


[dependencies]
tokio = { version = "1", features = ["full"] }
bincode = { version = "2.0.0", features = ["serde"] }
tokio-util = { version = "0.7", features = ["full"] }
reactor-actor = { path = "../../actor" }
reactor-macros = { path = "../../macros" }
reactor-inst = { path = "../../instrument"}
lazy_static = "1.5.0"
env_logger = "0.11"
serde_json = "1.0.140"
rand = "0.9.1"
log = "0.4.27"

tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-shared = "0.1.5"
criterion = "0.6.0"

opentelemetry = { version = "0.30.0", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.30.0", default-features = false, features = ["trace", "rt-tokio", "experimental_metrics_custom_reader"] }
opentelemetry-otlp = { version = "0.30.0", features = ["metrics", "grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.30.0", features = ["semconv_experimental"] }
tracing-core = { version = "0.1.34" }
tracing-opentelemetry = {version="0.31.0" }
opentelemetry-stdout = { version = "0.30.0", features = ["trace", "metrics"] }

[features]
chaos = []
